<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Signup Page</title>
</head>

<body>
    <header>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1jWXsYTijwUVsko7IiuJAoTJRcs1Z9Gb2ew&s"
            alt="Logo">
        <h1>Create your account</h1>
        <div>
            <p>Join Our Platform</p>
        </div>
    </header>
    <main>
        <form method="Post">
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="First Name">

            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="Last Name">
            <div>
                <label for="Emailaddress">Email address</label>
                <input type="text" id="Emailaddress" name="Email address" placeholder="Enter Your Email">
            </div>
            <div>
                <label for="Password">Password</label>
                <input type="password" id="Password" name="Password" placeholder="Enter Your Password">
            </div>
            <div>
                <label for="ConfirmPassword">Confirm Password</label>
                <input type="password" id="ConfirmPassword" name="Password">
                <div>
                    <input type="checkbox" id="terms">
                    <label for="terms">
                        I agree to the <a href="#">Terms of Service</a> and
                        <a href="#">Privacy Policy</a>
                    </label>
                </div>
                <button type="submit">Create Account</button>
            </div>
            <div>
                <hr>
                <span>or continue with</span>
                <hr>
            </div>
            <div>
                <a href="https://accounts.google.com/signup" target="_blank">Google</a>
                <a href="https://github.com/signup" target="_blank">GitHub</a>
            </div>

        </form>

    </main>
    <footer>
        <p>Already have an account? <a href="https;//Signup">Sign in</a></p>
    </footer>
</body>

</html>
